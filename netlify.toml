# Build settings for the Netlify site (sv-sa). Netlify reads this file when the
# repository is connected, so the UI needs no manual build configuration.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: public/_redirects does the same; this keeps it explicit.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
